name: Pages

# The project page (#356), ericdahl-dev.github.io/fm1-8p: site/ with the factory tone list and the browser
# installer, and the .fwsc and .dock built from this commit in fw/ (fm1-emu on the page plays that .fwsc; the
# installer installs it, or adds the .dock to fm1-dock). Nothing built is committed.
# A pull request builds the site but does not deploy it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The browser installer's tests (site/installer.js and the vendored fm1-dock code it uses; #356)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer tests (node --test)
        run: |
          node --version
          make check-site-js

      - name: Python packages for fm1-dock
        run: pip install "Pillow==$(sed -n 's/^PILLOW_VERSION=//p' firmware/pins.env)"

      # The same pinned inputs and build as ci.yml's fm1-firmware job (each download checked by hash).
      - name: Restore the pinned inputs
        uses: actions/cache/restore@v4
        with:
          path: build/fm1-deps
          key: fm1-deps-${{ hashFiles('firmware/pins.env') }}

      - name: Fetch and check pinned inputs
        run: tools/fm1-build.sh fetch

      - name: Build .dock and .fwsc
        run: tools/fm1-build.sh build

      - id: pages
        uses: actions/configure-pages@v5

      # The page, the browser installer, and fw/: the .fwsc and .dock with fw/index.json, their catalog (it refuses
      # a .fwsc whose identity is not firmware/pins.env's FM1_IDENTITY)
      - name: The site
        run: |
          python3 -B tools/site_build.py build/site "${{ steps.pages.outputs.base_url }}" \
            build/fm1/fm1-8p.fwsc build/fm1/fm1_8p.dock "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
