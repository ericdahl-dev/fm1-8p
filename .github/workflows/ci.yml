name: CI

on:
  push:
  pull_request:

jobs:
  # Which jobs a change needs (tools/ci_scope.sh): a change to the project page alone (site/ and its Pages
  # workflow, #356), with or without docs, skips the build, tests and firmware but runs the page's own tests;
  # a change to Markdown docs no check reads (README.md, docs/**/*.md but the two a check reads) skips them
  # all. build-test still runs, its other steps skipped, so the ruleset's required checks report.
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      scorecard: ${{ steps.scope.outputs.scorecard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The base: a pull request's own base (its merge commit's first parent); a push's fork point from main,
      # so a branch's earlier code changes count too (main's own pushes list nothing and run in full).
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$(git merge-base origin/main HEAD) || base=
          fi
          scope=$(sh tools/ci_scope.sh "$base")
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "CI scope: $scope (base ${base:-none})"
          # the scorecard's tests (about 10 minutes): when a change touches their inputs, and on every push to main
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            scorecard=scorecard
          else
            scorecard=$(sh tools/ci_scope.sh --scorecard "$base")
          fi
          echo "scorecard=$scorecard" >> "$GITHUB_OUTPUT"
          echo "CI scorecard tests: $scorecard"

  # Ubuntu with gcc and clang, and macOS (Apple clang, arm64). The Ubuntu jobs keep the names
  # "build-test (gcc)" and "build-test (clang)": ruleset "main requires CI" requires them.
  build-test:
    name: ${{ matrix.os == 'ubuntu-latest' && format('build-test ({0})', matrix.cc) || format('build-test ({0}, {1})', matrix.os, matrix.cc) }}
    needs: scope
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cc: [gcc, clang]
        include:
          - os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: The project page's tests (a change to the page alone runs only these)
        if: needs.scope.outputs.scope == 'page'
        run: python3 -B -m unittest tests/test_site.py

      - name: Docs only (no check reads them; nothing to build or test)
        if: needs.scope.outputs.scope == 'docs'
        run: echo "CI scope docs - the build, tests and firmware are skipped"

      - name: Build
        if: needs.scope.outputs.scope == 'full'
        run: make

      - name: Tests, the long sweeps too (TT_LONG=1, the asks race over every factory patch)
        if: needs.scope.outputs.scope == 'full'
        env:
          TT_LONG: 1
        run: make test

      # numpy and scipy pinned (firmware/pins.env), and SCORECARD_REQUIRE_NUMPY=1: the scorecard's tests run
      # here and can't skip (#404); only when the change touches their inputs, and on every push to main
      # (tools/ci_scope.sh --scorecard)
      - name: Python for the scorecard's tests
        if: needs.scope.outputs.scope == 'full' && needs.scope.outputs.scorecard == 'scorecard' && matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The scorecard's tests (numpy and scipy, none skipped)
        if: needs.scope.outputs.scope == 'full' && needs.scope.outputs.scorecard == 'scorecard' && matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        env:
          SCORECARD_REQUIRE_NUMPY: 1
        run: |
          python -m pip install "numpy==$(sed -n 's/^NUMPY_VERSION=//p' firmware/pins.env)" "scipy==$(sed -n 's/^SCIPY_VERSION=//p' firmware/pins.env)"
          make check-scorecard SCORECARD_PYTHON=python

      - name: Tests with AddressSanitizer and UBSan
        if: needs.scope.outputs.scope == 'full'
        run: |
          make clean
          make test CFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -DFM_CHECK_BUSY -DFM_CHECK_ENGINE"
          make clean

      - name: Long benchmark run under UBSan (the output buffer must not pile up)
        if: needs.scope.outputs.scope == 'full'
        run: |
          make BUILD=build/ubsan CFLAGS="-O1 -g -fsanitize=undefined -fno-sanitize-recover=all" build/ubsan/fm1-8p-bench
          ./build/ubsan/fm1-8p-bench -b 100000 -r 1 -w all

      - name: Float-free engine check
        if: needs.scope.outputs.scope == 'full'
        run: make check-float-free

      - name: FM-1 build script checks
        if: needs.scope.outputs.scope == 'full'
        run: make check-fm1-build

      - name: Test runner and killed-build checks
        if: needs.scope.outputs.scope == 'full'
        run: make check-runner

      - name: Factory patch converter (and firmware/patches.c up to date)
        if: needs.scope.outputs.scope == 'full'
        run: make check-patches
      - name: Display font (generated, unedited, within 6 KB; #55)
        if: needs.scope.outputs.scope == 'full'
        run: make check-font
      - name: Draw colors (all from the theme; #54)
        if: needs.scope.outputs.scope == 'full'
        run: make check-draw-colors

      - name: Sample render
        if: needs.scope.outputs.scope == 'full'
        run: |
          make render-demo
          ls -l build/demo.wav

      - name: Benchmark (short run; shared runners are too noisy to compare; prints the clock step)
        if: needs.scope.outputs.scope == 'full'
        run: |
          make build/fm1-8p-bench
          ./build/fm1-8p-bench -h
          ./build/fm1-8p-bench -b 200 -r 3 -w all

      - name: Upload sample render
        if: needs.scope.outputs.scope == 'full' && (matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc')
        uses: actions/upload-artifact@v4
        with:
          name: demo-wav
          path: build/demo.wav
          if-no-files-found: error

  # The FM-1 firmware: the playable synth (#44) and the CPU test (#12). Pinned fm1-dock, JieLi toolchain and SDK files, each
  # checked by hash; fm1-dock's safety checks must reject the canaries. Not a required check.
  fm1-firmware:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages for fm1-dock
        run: pip install "Pillow==$(sed -n 's/^PILLOW_VERSION=//p' firmware/pins.env)"

      # Every pinned download (fm1-dock, the toolchain, the SDK files, fm1-emu), keyed on the pins, so
      # a run downloads only when a pin changes; fetch still checks each one. Saved as soon as the
      # fetch succeeds, so a later failing step doesn't lose it.
      - name: Restore the pinned inputs
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/fm1-deps
          key: fm1-deps-${{ hashFiles('firmware/pins.env') }}

      - name: Fetch and check pinned inputs
        run: tools/fm1-build.sh fetch

      - name: Fetch fm1-emu (for the report-only steps)
        continue-on-error: true
        run: tools/fm1-build.sh fetch-emu

      - name: Save the pinned inputs
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/fm1-deps
          key: fm1-deps-${{ hashFiles('firmware/pins.env') }}

      - name: Build .dock and .fwsc
        run: tools/fm1-build.sh build

      - name: Unsafe modules must fail the build
        run: tools/fm1-build.sh canaries

      - name: CPU budget in fm1-emu (strict timing, report only)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64
          rc=0
          tools/fm1-build.sh emu || rc=$?
          {
            echo "## CPU test in fm1-emu (strict timing, report only)"
            echo
            echo "Worst render time per voice count, 0.5 s held each. fm1-emu's strict mode read ~10-15 % below"
            echo "the device on FM-1 SID; this becomes a gate once #13 calibrates it against hardware."
            echo
            cat build/fm1/emu-report.md 2>/dev/null || echo "**No report: the run failed before it (see the log).**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: FM1-8P plays a note sequence in fm1-emu (strict timing, report only)
        continue-on-error: true
        run: |
          rc=0
          tools/fm1-build.sh emu-play || rc=$?
          {
            echo "## FM1-8P in fm1-emu: keys and MIDI (strict timing, report only)"
            echo
            echo "A chord from the keys, then MIDI with bend, sustain and a stolen voice; must run with no overrun."
            echo
            cat build/fm1/emu-play-report.md 2>/dev/null || echo "**No report: the run failed before it (see the log).**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: FM1-8P's SAVE writes in silence in fm1-emu (#48, strict timing, report only)
        continue-on-error: true
        run: |
          rc=0
          tools/fm1-build.sh emu-save || rc=$?
          {
            echo "## FM1-8P's SAVE in fm1-emu: the flash write lands in silence (#48, report only)"
            echo
            echo "A chord held, SAVE tapped twice while it sounds, released: the one write must come after the release, with silence around it."
            echo
            cat build/fm1/emu-save-report.md 2>/dev/null || echo "**No report: the run failed before it (see the log).**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload the synth
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-8p
          path: |
            build/fm1/fm1_8p.dock
            build/fm1/fm1-8p.fwsc
          if-no-files-found: error

      - name: Upload firmware
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-8p-cpu
          path: |
            build/fm1/fm1_8p_cpu.dock
            build/fm1/fm1-8p-cpu.fwsc
          if-no-files-found: error

      - name: Upload fm1-emu report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-emu-report
          path: |
            build/fm1/emu-report.md
            build/fm1/emu.log
            build/fm1/emu-play-report.md
            build/fm1/emu-play.log
            build/fm1/emu-play/panel.png
            build/fm1/emu-save-report.md
            build/fm1/emu-save.log
            build/fm1/emu-save/log.txt
          if-no-files-found: warn
