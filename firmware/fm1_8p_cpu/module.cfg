# fm1-dock module (tools/hbmod.py): the CPU test around the unchanged engine.
# tools/fm1-build.sh stages it with @ENGINE_SOURCES@ = every engine/*.c and @ENGINE@ = engine/.
name = FM1-8P CPU
version = 1
sources = ../cpu_test.c @ENGINE_SOURCES@
includes = .. @ENGINE@
cflags = -Os -Werror=double-promotion
