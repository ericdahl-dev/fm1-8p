# fm1-dock module (tools/hbmod.py): the CPU test around the unchanged engine.
# tools/fm1-build.sh stages it with @ENGINE_SOURCES@ = every engine/*.c and @ENGINE@ = engine/.
name = FM1-8P CPU
version = 1
sources = ../cpu_test.c @ENGINE_SOURCES@
includes = .. @ENGINE@
# The engine and the CPU test are the render path: they build at hbmod's default -O2 (its CFLAGS), so the
# per-sample calls inline (#34). The screen and keys (this directory's own file) stay -Os.
cflags = -Werror=double-promotion
cflags fm1_8p_cpu.c = -Os
