# fm1-dock module (tools/hbmod.py): the CPU test with a page of the UI redrawing as it times (#47), for
# the UI-active rows (tools/fm1-build.sh emu-ui). The same sweep as fm1_8p_cpu_quick (0.5 s a count),
# while VCF page 5A shows and its CUTOFF turns one click each way every frame (33 ms): the focus row,
# the curve and two columns redraw, the heaviest a turn draws. The pages' values come from their own
# play (never rendered); the sound is the CPU test's.
# tools/fm1-build.sh stages it with @ENGINE_SOURCES@ = every engine/*.c and @ENGINE@ = engine/.
name = FM1-8P CPU
version = 1
sources = ../fm1_8p_cpu/fm1_8p_cpu.c ../cpu_test.c ../play.c ../ui.c ../ui_map.c ../patches.c ../patch.c ../patch_store.c ../fm1_8p/draw.c @ENGINE_SOURCES@
includes = .. ../fm1_8p ../../docs/ui/mockups @ENGINE@
# As fm1_8p: the render path at hbmod's default -O2, the screen, keys and pages -Os.
cflags = -Werror=double-promotion -DCPU_HOLD_BLOCKS=86u -DCPU_UI
cflags ../fm1_8p_cpu/fm1_8p_cpu.c = -Os
cflags ../fm1_8p/draw.c = -Os
cflags ../ui.c = -Os
cflags ../patch_store.c = -Os
