# The CPU test with a 0.5 s hold per voice count (86 blocks), for the fm1-emu run in CI.
# Same code as fm1_8p_cpu; only the hold differs.
name = FM1-8P CPU
version = 1
sources = ../fm1_8p_cpu/fm1_8p_cpu.c ../cpu_test.c @ENGINE_SOURCES@
includes = .. @ENGINE@
# As fm1_8p_cpu: hbmod's default -O2 for the render path, -Os for the screen and keys.
cflags = -Werror=double-promotion -DCPU_HOLD_BLOCKS=86u
cflags ../fm1_8p_cpu/fm1_8p_cpu.c = -Os
