# fm1-dock module (tools/hbmod.py): the playable fm1-8p, keys and MIDI into the engine (firmware/play.c).
# tools/fm1-build.sh stages it with @ENGINE_SOURCES@ = every engine/*.c and @ENGINE@ = engine/.
name = FM1-8P
version = 1
# the engine first: it links right after the module directory's own files, so other firmware growing
# never moves its render code (the render's cache behavior follows where it lands; #237's ui row)
sources = @ENGINE_SOURCES@ ../play.c ../ui.c ../ui_save.c ../ui_seq.c ../ui_map.c ../ui_settings.c ../seq.c ../pattern_now.c ../pattern_store.c ../settings_store.c ../patches.c ../patch.c ../patch_store.c ../dfont.c
includes = .. ../../docs/ui/mockups @ENGINE@
# The engine and play.c are the render path: they build at hbmod's default -O2 (its CFLAGS), so the
# per-sample calls inline (#34). The keys and the screen (this directory's files) and the pages'
# logic (ui.c) stay -Os. The display font comes from docs/ui/mockups/display_font.h.
cflags = -Werror=double-promotion
cflags fm1_8p.c = -Os
cflags draw.c = -Os
cflags ../ui.c = -Os
cflags ../patch_store.c = -Os
cflags ../ui_save.c = -Os
cflags ../ui_seq.c = -Os
cflags ../dfont.c = -Os
