# fm1-dock module (tools/hbmod.py): the playable fm1-8p, keys and MIDI into the engine (firmware/play.c).
# tools/fm1-build.sh stages it with @ENGINE_SOURCES@ = every engine/*.c and @ENGINE@ = engine/.
name = FM1-8P
version = 1
sources = ../play.c ../ui.c ../ui_map.c ../patches.c ../patch.c @ENGINE_SOURCES@
includes = .. ../../docs/ui/mockups @ENGINE@
# The engine and play.c are the render path: they build at hbmod's default -O2 (its CFLAGS), so the
# per-sample calls inline (#34). The screen and keys (this directory's own file) and the pages'
# logic (ui.c) stay -Os. The display font comes from docs/ui/mockups/display_font.h.
cflags = -Werror=double-promotion
cflags fm1_8p.c = -Os
cflags ../ui.c = -Os
