# The CPU test with step F played by a running sequencer (#36, CPU_SEQ in cpu_test.h), for its fm1-emu row
# (tools/fm1-build.sh emu-seq; tools/gate_cpu.sh's "seq" row, with ring): the 0.5 s hold of
# fm1_8p_cpu_quick, and F is the full patch on PLAY_VOICES voices, a 6-note chord every step cut to them,
# 300 BPM, gate 100 %: every step lets the voices go and retriggers them in one block.
name = FM1-8P CPU
version = 1
# the engine first: it links right after the module directory's own files, so other firmware growing
# never moves its render code (the render's cache behavior follows where it lands; #237's ui row)
sources = @ENGINE_SOURCES@ ../fm1_8p_cpu/fm1_8p_cpu.c ../cpu_test.c ../seq.c
includes = .. @ENGINE@
# As fm1_8p_cpu: hbmod's default -O2 for the render path, -Os for the screen and keys.
cflags = -Werror=double-promotion -DFM_RAM_TEXT -DCPU_HOLD_BLOCKS=86u -DCPU_SEQ
cflags ../fm1_8p_cpu/fm1_8p_cpu.c = -Os
